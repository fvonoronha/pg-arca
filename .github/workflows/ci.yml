name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x bin/arca bin/lib.sh tests/integration.sh

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    steps:
      - uses: actions/checkout@v7
      - name: Teste de ponta a ponta (Postgres ${{ matrix.pg }})
        run: PG_MAJOR=${{ matrix.pg }} tests/integration.sh
