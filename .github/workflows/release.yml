name: Release

# Publica as imagens no GHCR ao publicar uma release (ou manualmente, como "dev").
# Uma imagem por versão do Postgres, para amd64 e arm64.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: ["15", "16", "17"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            TAGS="$IMAGE:pg${{ matrix.pg }},$IMAGE:${VERSION}-pg${{ matrix.pg }}"
            # latest = Postgres mais novo
            [ "${{ matrix.pg }}" = "17" ] && TAGS="$TAGS,$IMAGE:latest,$IMAGE:${VERSION}"
          else
            VERSION="dev"
            TAGS="$IMAGE:dev-pg${{ matrix.pg }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PG_MAJOR=${{ matrix.pg }}
            ARCA_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=pg${{ matrix.pg }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg }}
